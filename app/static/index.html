<!DOCTYPE html>
<html lang="pt-BR" data-tema="cockpit">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cockpit Docker</title>
<!-- Descreve o painel para quem vê o endereço fora dele: prévia de link colado num
     chat, aba restaurada, gerenciador de favoritos, leitor de tela anunciando a
     página. NÃO é para buscador — o robots.txt pede para não indexar, e a razão
     está lá. Sem descrição, esses lugares mostram o primeiro texto que acharem no
     corpo, que aqui é "carregando...". -->
<meta name="description" content="Painel de operação de containers Docker: estado dos serviços, achados de segurança e ingress, métricas de host e trilha de auditoria." />
<!-- Fontes auto-hospedadas (ver css/fontes.css). Saíram daqui um <link> bloqueante para
     o CDN do Google e dois preconnect: o Google recebia o IP de cada visitante, e o
     primeiro pixel dependia de aquele host estar acessível. -->
<link rel="stylesheet" href="/static/css/fontes.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/themes.css">
<link rel="stylesheet" href="/static/css/components.css">
<!-- O ícone já existia, declarado só no manifest — que serve para INSTALAR a app, não
     para pintar a aba. Sem este link o navegador pedia /favicon.ico e levava 404. -->
<link rel="icon" type="image/svg+xml" href="/static/assets/icon.svg">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a1020">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div class="brand-title">Cockpit Docker</div>
        <div class="brand-sub"><span class="live-dot"></span> <span id="globalSummary">carregando...</span></div>
      </div>
    </div>

    <nav class="rail" aria-label="Navegação principal">
      <!-- `#/` e não `#/overview`: `#/` É a hash canônica do cockpit do host
           (`escopo.js::paraHash`), a mesma que o kernel escreve ao voltar da
           subtela. Com um apelido aqui, o item nunca casava com a hash que o
           próprio painel produz, e a marca de "você está aqui" mentia. O
           `aria-current` inicial saiu junto: quem o move agora é `marcarRail()`,
           e um atributo fixo no HTML só teria a chance de estar errado. -->
      <a href="#/" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Visão Geral</span>
      </a>
      <a href="#/plantao" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Plantão</span>
      </a>
      <!-- "Incidente" e "Dossiê" saíram daqui: eram os dois únicos itens do rail
           sem módulo correspondente no registro (`static/js/modulos/`). Vinham da
           arquitetura de telas anterior e nunca ganharam contrapartida — com o
           roteador ligado, continuariam sendo os dois cliques que não levam a
           lugar nenhum. Link para o que não existe não é navegação, é armadilha.

           O selo de achados abertos morava dentro de "Incidente". A contagem não
           se perdeu: o chip `Atenção` da régua traz "N crít +M" com o total no
           title, e a faixa crítica anuncia o achado mais grave em banner — as
           duas mais informativas que o número solto que havia aqui. -->
      <a href="#/auditoria" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span>Auditoria</span>
      </a>
      <!-- "Logs" saiu pelo mesmo motivo, descoberto ao MEDIR o rail já consertado:
           o módulo existe, mas declara `escopos: ['stack','container']` — não há
           caixa de logs no cockpit do host, e o item era um terceiro clique sem
           destino. Log se lê dentro de um container ou de uma stack; o caminho é
           a lista lateral, ou a busca do índice dentro daquele cockpit. -->
      <a href="#/ingress" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>Ingress &amp; TLS</span>
      </a>
      <a href="#/topologia" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><circle cx="5" cy="19" r="2"/><line x1="12" y1="9" x2="17" y2="7"/><line x1="12" y1="15" x2="17" y2="17"/><line x1="7" y1="7" x2="5" y2="5"/><line x1="7" y1="17" x2="5" y2="19"/></svg>
        <span>Topologia</span>
      </a>
      <a href="#/backend" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        <span>Backend</span>
      </a>
      <a href="#/projetos" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>Projetos</span>
      </a>
      <a href="#/capacidade" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Capacidade</span>
      </a>
      <a href="#/tarefas" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Tarefas</span>
      </a>
      <a href="#/executivo" class="rail-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span>Executivo</span>
      </a>
    </nav>

    <div class="sidebar-search">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <!-- aria-label em vez de <label> visivel: o campo e identificado pelo icone de lupa
             e pelo placeholder, e placeholder NAO e nome acessivel — some ao digitar e
             leitor de tela nao o anuncia como rotulo. -->
        <input type="text" class="search-input" id="searchInput"
               aria-label="Buscar container" placeholder="Buscar container...">
      </div>
    </div>

    <div class="filters" id="filters">
      <button type="button" class="filter-pill active" data-filter="all">Todos</button>
      <button type="button" class="filter-pill" data-filter="running">Rodando</button>
      <button type="button" class="filter-pill" data-filter="exited">Parados</button>
      <button type="button" class="filter-pill" data-filter="unhealthy">Unhealthy</button>
    </div>

    <div style="display:flex;padding:.5rem 1rem;border-bottom:1px solid var(--border);gap:.5rem;flex-wrap:wrap">
      <button type="button" id="unlockBtn" style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.35rem .6rem;cursor:pointer;color:var(--text-dim);font-size:.7rem;font-family:inherit;display:flex;align-items:center;gap:.35rem" title="Destravar para mutações">
        <svg id="unlockIcon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
        <span id="unlockLabel">Destravar</span>
      </button>
      <button type="button" id="depthToggle" style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.35rem .6rem;cursor:pointer;color:var(--text-dim);font-size:.7rem;font-family:inherit;display:flex;align-items:center;gap:.35rem" title="Profundidade de análise">
        <span style="font-size:.6rem;font-weight:600" id="depthLabel">DADO</span>
      </button>
      <button type="button" id="themeToggle" style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.35rem .6rem;cursor:pointer;color:var(--text-dim);font-size:.7rem;font-family:inherit;display:flex;align-items:center;gap:.35rem" title="Alternar tema">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        Tema
      </button>
    </div>

    <div class="container-list" id="containerList">
      <div style="padding:.5rem">
        <div style="display:flex;align-items:center;gap:.65rem;padding:.65rem .8rem">
          <div class="skeleton" style="width:8px;height:8px;border-radius:50%"></div>
          <div style="flex:1"><div class="skeleton" style="width:70%;height:.85rem"></div>
          <div class="skeleton" style="width:45%;height:.7rem;margin-top:.3rem"></div></div>
        </div>
        <div style="display:flex;align-items:center;gap:.65rem;padding:.65rem .8rem">
          <div class="skeleton" style="width:8px;height:8px;border-radius:50%"></div>
          <div style="flex:1"><div class="skeleton" style="width:55%;height:.85rem"></div>
          <div class="skeleton" style="width:35%;height:.7rem;margin-top:.3rem"></div></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="mainTitle">Cockpit Docker</h1>
        <div class="muted" id="mainSubtitle">Selecione um container para inspecionar</div>
      </div>
      <button type="button" id="personalizarBtn" class="pz-abrir" aria-pressed="false"
              title="Personalizar cockpit: ocultar, mover e presets">⋮⋮ Personalizar</button>
    </header>

    <!-- Kernel: fora da área rolável e fora do registro de módulos.
         Invariante 1 do doc 10 — os vitais não podem ser ocultados, arrastados
         nem cobertos pela subtela. Invariante 2 — a faixa crítica é do host
         inteiro e aparece em qualquer escopo. -->
    <div id="kernelFaixa" hidden></div>
    <div id="kernelReguaSlot"></div>
    <div id="kernelPainel" hidden></div>

    <!-- Grade de módulos do escopo aberto. -->
    <div id="screenContainer"></div>

    <!-- Subtela central: abre ABAIXO do header e da régua, de propósito. -->
    <div id="kernelSubtela" class="sub-overlay" hidden></div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Confirmação</div>
    <div class="modal-text" id="modalText">Tem certeza?</div>
    <div class="modal-input-wrap" id="modalInputWrap" style="display:none">
      <!-- O rotulo ja existia; faltava o `for`, entao a associacao nunca acontecia e o
           campo chegava sem nome ao leitor de tela. -->
      <label for="modalInput" style="margin-bottom:.25rem;font-size:.8rem;color:var(--text-dim)">Digite <strong id="modalConfirmName"></strong> para confirmar:</label>
      <input class="modal-input" id="modalInput" type="text" placeholder="digite o nome">
    </div>
    <div class="modal-checkbox" id="modalCheckboxWrap" style="display:none">
      <label style="display:flex;align-items:center;gap:.5rem">
        <input type="checkbox" id="modalCheckbox">
        <span id="modalCheckboxLabel"></span>
      </label>
    </div>
    <div class="modal-actions">
      <button type="button" class="modal-btn cancel" id="modalCancel">Cancelar</button>
      <button type="button" class="modal-btn confirm" id="modalConfirm">Confirmar</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
