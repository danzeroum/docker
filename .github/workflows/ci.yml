name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────
  # 1. Testes de unidade/integração (sem Docker)
  # ─────────────────────────────────────────────
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-test.txt

      - name: Instalar dependências de teste
        run: pip install -r tests/requirements-test.txt

      - name: Rodar pytest
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # 2. Build das imagens Docker
  # ─────────────────────────────────────────────
  docker-build:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar .env mínimo para o build
        run: |
          cp .env.example .env
          # Cria arquivos que o compose referencia como volumes
          mkdir -p nginx certbot/conf certbot/www
          touch nginx/nginx.conf nginx/.htpasswd

      - name: Build das imagens
        run: docker compose build --no-cache

      - name: Smoke test: health endpoint
        run: |
          docker compose up -d docker-socket-proxy app
          # Aguarda healthchecks passarem (máx 45s)
          for i in $(seq 1 9); do
            STATUS=$(docker compose ps --format json app 2>/dev/null | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo '')
            echo "Tentativa $i — Health: ${STATUS:-aguardando}"
            curl -sf http://localhost:8000/health && break
            sleep 5
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/api/containers | python3 -c "import sys,json; json.load(sys.stdin); print('JSON válido')"
          docker compose down
