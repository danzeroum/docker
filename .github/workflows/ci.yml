name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------
  # 1. Testes de unidade/integracao (sem Docker)
  # -------------------------------------------------
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-test.txt

      - name: Instalar dependencias de teste
        run: pip install -r tests/requirements-test.txt

      - name: Rodar pytest
        run: pytest tests/ -v --tb=short

  # -------------------------------------------------
  # 2. Build das imagens Docker + smoke test
  # -------------------------------------------------
  docker-build:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar .env minimo para o build
        run: |
          cp .env.example .env
          mkdir -p nginx certbot/conf certbot/www
          touch nginx/nginx.conf nginx/.htpasswd

      - name: Build das imagens
        run: docker compose build --no-cache

      - name: Subir servicos
        run: docker compose up -d docker-socket-proxy app

      # O app fica na rede 'internal' (isolada) — o runner nao acessa via localhost.
      # Usamos `docker compose exec` para rodar wget de DENTRO do container.
      - name: Aguardar app ficar saudavel (exec interno)
        run: |
          for i in 1 2 3 4 5 6 7 8 9; do
            echo "Tentativa $i..."
            docker compose exec app wget -qO- http://localhost:8000/health && exit 0
            sleep 5
          done
          echo "Timeout: app nao respondeu"
          docker compose logs app
          docker compose logs docker-socket-proxy
          exit 1

      - name: Smoke test endpoints (exec interno)
        run: |
          docker compose exec app wget -qO- http://localhost:8000/health
          docker compose exec app wget -qO- http://localhost:8000/api/containers
          docker compose exec app wget -qO- http://localhost:8000/api/info

      - name: Derrubar servicos
        if: always()
        run: docker compose down
