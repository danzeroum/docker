# O cockpit nao sobe nginx proprio — o servidor ja tem um global-ingress
# em /opt/btv/ingress que detem as portas 80/443.
# O servico app entra na rede btv-prod-net para que o ingress possa
# fazer proxy_pass para http://docker-cockpit:8000.

services:

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    container_name: docker-cockpit-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      DELETE: 1
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  app:
    build: ./app
    container_name: docker-cockpit
    restart: unless-stopped
    env_file: .env
    environment:
      SOCKET_PROXY: http://docker-cockpit-proxy:2375
    networks:
      - internal
      - btv-prod-net   # visivel ao global-ingress
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    internal: true
  btv-prod-net:
    external: true   # rede ja existente criada pelo global-ingress
