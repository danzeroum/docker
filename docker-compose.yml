# O cockpit nao sobe nginx proprio — o servidor ja tem um global-ingress
# em /opt/btv/ingress que detem as portas 80/443.
# O servico app entra na rede btv-prod-net para que o ingress possa
# fazer proxy_pass para http://docker-cockpit:8000.

services:

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    container_name: docker-cockpit-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      EVENTS: 1
      SYSTEM: 1
      POST: 1
      DELETE: 1
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  app:
    build: ./app
    container_name: docker-cockpit
    restart: unless-stopped
    env_file: .env
    environment:
      SOCKET_PROXY: http://docker-cockpit-proxy:2375
      DOCKER_HOST: tcp://docker-cockpit-proxy:2375
      # Caminho do nginx.conf do ingress DENTRO do container. E consequencia
      # direta do volume logo abaixo, entao mora aqui e nao no .env: separar os
      # dois deixa o padrao do codigo (/etc/nginx/nginx.conf) valer em silencio.
      # Sem isto o parser nao acha o arquivo, as 11 regras de ingress nunca
      # rodam e a tela Ingress & TLS fica vazia — sem erro nenhum.
      NGINX_CONFIG_PATH: /etc/nginx-ingress/nginx.conf
      # Pin explicito, no MESMO commit que inverteu o padrao do codigo para 0.
      #
      # A partir da barreira do B10, ENABLE_ACTIONS desligado nao devolve 403:
      # as rotas de mutacao nao sao REGISTRADAS (404). Instalacao nova nasce sem
      # superficie de escrita, e ligar e ato deliberado — este pin e esse ato,
      # para esta producao.
      #
      # Sem ele, o deploy deste commit derrubaria o fluxo unlock->reiniciar que
      # ja funciona aqui: as 4 rotas de container e as 2 de stack sumiriam sem
      # ninguem ter pedido. Se um dia o cockpit voltar a ser estritamente
      # somente-leitura, o lugar de decidir isso e esta linha.
      ENABLE_ACTIONS: "1"
      # TRUSTED_GATEWAY_CIDR: 172.x.0.0/16
      # Descubra com: docker network inspect btv-prod-net --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      # Se ausente, /session/unlock retorna 403 (fail-closed) e loga warning.
    volumes:
      - /opt/btv/ingress/nginx:/etc/nginx-ingress:ro
      # B8: os compose files das stacks vivem aqui, e o rotulo
      # com.docker.compose.project.config_files grava o caminho DO HOST. Como o
      # mount usa o mesmo caminho dos dois lados, o rotulo resolve direto — se
      # um dia o destino mudar, o drift passa a mostrar "nao encontrado" por
      # projeto, em vez de sumir em silencio.
      - /opt/btv:/opt/btv:ro
      - cockpit-data:/data
    networks:
      - internal
      - btv-prod-net   # visivel ao global-ingress
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cockpit-data:

networks:
  internal:
    internal: true
  btv-prod-net:
    external: true   # rede ja existente criada pelo global-ingress
