# O cockpit nao sobe nginx proprio — o servidor ja tem um global-ingress
# em /opt/btv/ingress que detem as portas 80/443.
# O servico app entra na rede btv-prod-net para que o ingress possa
# fazer proxy_pass para http://docker-cockpit:8000.

services:

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    container_name: docker-cockpit-proxy
    # Medido na bancada com 42 containers: 4,7 MiB, 2 threads — e nao cresce com
    # a quantidade de containers. 64m e treze vezes o medido.
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    cpus: 0.5
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      EVENTS: 1
      SYSTEM: 1
      POST: 1
      DELETE: 1
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  app:
    build: ./app
    container_name: docker-cockpit
    restart: unless-stopped
    # ---------------------------------------------------------------------
    # Tetos de recurso. O painel nao tinha nenhum, e essa e a falha de modo
    # mais feia possivel para ele: um vazamento aqui derruba o HOST que ele
    # existe para vigiar, e o OOM killer do kernel escolhe a vitima por
    # heuristica — pode levar o nginx, o banco de outra stack, qualquer coisa.
    #
    # Com teto, quem morre e o cockpit, dentro do proprio cgroup, e o
    # `restart: unless-stopped` o traz de volta. O monitor cai e reinicia em
    # vez de derrubar o que monitora. E a troca certa.
    #
    # Medido na bancada com 42 containers: 62 MiB em regime, 88 MiB no pico da
    # ingestao de logs, 12 threads. O consumo NAO acompanha a quantidade de
    # containers — e dominado pelo runtime Python. 512m e cerca de seis vezes o
    # pico observado, folga para a ingestao de log de uma VPS bem maior.
    #
    # `memswap_limit` igual ao `mem_limit` desliga swap para o container. Sem
    # isso o Docker concede o dobro em swap, e um processo que engorda passa a
    # castigar o DISCO do host em vez de bater no teto e morrer depressa.
    #
    # `cpus: 2.0` e generoso de proposito, e nao um numero apertado: CPU e
    # recurso RECUPERAVEL — sob disputa tudo fica mais lento e o escalonador
    # resolve. Memoria nao: quem estoura mata terceiro. Estrangular a CPU do
    # painel o deixaria lento exatamente na hora em que o host esta em apuros,
    # que e quando alguem precisa dele.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    cpus: 2.0
    env_file: .env
    environment:
      SOCKET_PROXY: http://docker-cockpit-proxy:2375
      DOCKER_HOST: tcp://docker-cockpit-proxy:2375
      # Caminho do nginx.conf do ingress DENTRO do container. E consequencia
      # direta do volume logo abaixo, entao mora aqui e nao no .env: separar os
      # dois deixa o padrao do codigo (/etc/nginx/nginx.conf) valer em silencio.
      # Sem isto o parser nao acha o arquivo, as 11 regras de ingress nunca
      # rodam e a tela Ingress & TLS fica vazia — sem erro nenhum.
      NGINX_CONFIG_PATH: /etc/nginx-ingress/nginx.conf
      # Pin explicito, no MESMO commit que inverteu o padrao do codigo para 0.
      #
      # A partir da barreira do B10, ENABLE_ACTIONS desligado nao devolve 403:
      # as rotas de mutacao nao sao REGISTRADAS (404). Instalacao nova nasce sem
      # superficie de escrita, e ligar e ato deliberado — este pin e esse ato,
      # para esta producao.
      #
      # Sem ele, o deploy deste commit derrubaria o fluxo unlock->reiniciar que
      # ja funciona aqui: as 4 rotas de container e as 2 de stack sumiriam sem
      # ninguem ter pedido. Se um dia o cockpit voltar a ser estritamente
      # somente-leitura, o lugar de decidir isso e esta linha.
      ENABLE_ACTIONS: "1"
      # TRUSTED_GATEWAY_CIDR: 172.x.0.0/16
      # Descubra com: docker network inspect btv-prod-net --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      # Se ausente, /session/unlock retorna 403 (fail-closed) e loga warning.
    volumes:
      - /opt/btv/ingress/nginx:/etc/nginx-ingress:ro
      # B8: os compose files das stacks vivem aqui, e o rotulo
      # com.docker.compose.project.config_files grava o caminho DO HOST. Como o
      # mount usa o mesmo caminho dos dois lados, o rotulo resolve direto — se
      # um dia o destino mudar, o drift passa a mostrar "nao encontrado" por
      # projeto, em vez de sumir em silencio.
      - /opt/btv:/opt/btv:ro
      # 5-certs: descomente as DUAS linhas para o cockpit ler notAfter dos
      # certificados. live/ e feito de symlinks para archive/, entao montar so
      # o primeiro entrega um diretorio de links quebrados — o cockpit reporta
      # isso como aviso, corretamente, mas sem ler certificado nenhum.
      # Comentadas por padrao: a decisao de expor /etc/letsencrypt e do operador,
      # e sem elas a chave certs_expiring segue null, que e a leitura honesta de
      # "nao estou olhando".
      # - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      # - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
      - cockpit-data:/data
    networks:
      - internal
      - btv-prod-net   # visivel ao global-ingress
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cockpit-data:

networks:
  internal:
    internal: true
  btv-prod-net:
    external: true   # rede ja existente criada pelo global-ingress
