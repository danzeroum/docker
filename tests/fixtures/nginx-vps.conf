worker_processes auto;
events { worker_connections 1024; use epoll; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    server { listen 80 default_server; listen [::]:80 default_server; server_name _; return 444; }
    server { listen 443 ssl default_server; listen [::]:443 ssl default_server; server_name _;
        ssl_certificate /etc/letsencrypt/live/prompte.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prompte.buildtovalue.cloud/privkey.pem;
        return 444; }

    server { listen 80; server_name prompte.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; } }
    server { listen 443 ssl; server_name prompte.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/prompte.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prompte.buildtovalue.cloud/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        location ~* (wp-login|login\.cgi|\.git|env) { return 444; }
        location / { set $upstream "http://prompte-frontend:80"; proxy_pass $upstream; } }

    server { listen 80; server_name chatcorp.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; } }
    server { listen 443 ssl; server_name chatcorp.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/chatcorp.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chatcorp.buildtovalue.cloud/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        location ~* (wp-login|login\.cgi|\.git|env|xmlrpc|config) { return 444; }
        location / { set $upstream "http://btvchatcorp-frontend-1:80"; proxy_pass $upstream; } }

    server { listen 80; server_name juridico.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; } }
    server { listen 443 ssl; server_name juridico.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/juridico.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/juridico.buildtovalue.cloud/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        location ~* (wp-login|login\.cgi|\.git|env) { return 444; }
        location = / { return 302 /app/; }
        location /app {
            set $upstream "http://central-inteligencia-juridica:8000";
            proxy_pass $upstream;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
        }
        location ~ ^/(docs|redoc)/?$ {
            set $upstream "http://central-inteligencia-juridica:8000";
            proxy_pass $upstream;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self' https://cdn.jsdelivr.net" always;
        }
        location / { set $upstream "http://central-inteligencia-juridica:8000"; proxy_pass $upstream; } }

    server { listen 80; server_name docs.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; } }
    server { listen 443 ssl; server_name docs.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/docs.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/docs.buildtovalue.cloud/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        root /usr/share/nginx/docs; index index.html;
        location / { try_files $uri $uri/ =404; } }

    server { listen 80; server_name demo.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; } }
    server { listen 443 ssl; server_name demo.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/demo.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.buildtovalue.cloud/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        root /usr/share/nginx/demo; index index.html;
        location /v1/ { set $up_demo "http://btv-governance:8000"; proxy_pass $up_demo; }
        location / { try_files $uri $uri/ =404; } }

    server { listen 80; server_name executagent.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location ~* (wp-login|login\.cgi|\.git|env) { return 444; }
        location / { set $upstream "http://executagent-studio:80"; proxy_pass $upstream; } }

    server { listen 80; server_name familia-web.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location ~* (wp-login|login\.cgi|\.git|env) { return 444; }
        location / { set $upstream "http://familia-web:3000"; proxy_pass $upstream; } }

    server { listen 80; listen [::]:80; server_name btv.buildtovalue.cloud localhost;
        location = / { return 200 "Global Ingress Gateway Operational\n"; add_header Content-Type text/plain; } }
    server { listen 443 ssl; server_name executagent.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/executagent.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/executagent.buildtovalue.cloud/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        location / { set $upstream "http://executagent-studio:80"; proxy_pass $upstream; } }
    server { listen 443 ssl; server_name familia-web.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/familia-web.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/familia-web.buildtovalue.cloud/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        location / { set $upstream "http://familia-web:3000"; proxy_pass $upstream; } }
    server {
        listen 80;
        server_name conciliaia.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name conciliaia.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/conciliaia.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/conciliaia.buildtovalue.cloud/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        location ~* (wp-login|login\.cgi|\.git|env) { return 444; }
        location / { set $upstream "http://conciliaai-backend:8000"; proxy_pass $upstream; }
    }
    server {
        listen 80;
        server_name criptotrade.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
    listen 443 ssl;
    server_name criptotrade.buildtovalue.cloud;

    ssl_certificate /etc/letsencrypt/live/criptotrade.buildtovalue.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/criptotrade.buildtovalue.cloud/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    location ~* (wp-login|login\.cgi|\.git|env) { return 444; }

    # API: /api/health -> app:/health, /api/metrics -> app:/metrics
    location ^~ /api/ {
        set $upstream "http://criptotrade-app:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # Documentação da API permanece disponível.
    location = /docs {
        set $upstream "http://criptotrade-app:8000";
        proxy_pass $upstream;
    }

    location = /openapi.json {
        set $upstream "http://criptotrade-app:8000";
        proxy_pass $upstream;
    }

    # Frontend é o destino padrão do domínio.
    location / {
        set $upstream "http://criptotrade-frontend:80";
        proxy_pass $upstream;
    }
}

# ---- giva (ACME + redirect) ----
server {
    listen 80;
    server_name giva.executagent.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- giva (ATIVO) ----
server {
    listen 443 ssl;
    server_name giva.executagent.com;
    ssl_certificate     /etc/letsencrypt/live/giva.executagent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giva.executagent.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~* (wp-login|login\.cgi|\.git|\.env) { return 444; }
    location ^~ /api/ {
        set $upstream "http://giva-api-1:8000";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $upstream;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
    }
    location ~* \.(js|css|png|jpg|jpeg|svg|woff|woff2|ico)$ {
        set $upstream "http://giva-frontend-1:80";
        proxy_pass $upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        set $upstream "http://giva-frontend-1:80";
        proxy_pass $upstream;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}


