worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens on;
    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s;
    gzip on; gzip_types text/plain text/css application/json;

    server {
        listen 80 http2;
        server_name http2-test.btv.local;
        client_max_body_size 20M;
        location / { proxy_pass http://http2-backend:80; }
    }

    server {
        listen 80;
        server_name normal.btv.local;
        client_max_body_size 10M;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name normal.btv.local;
        client_max_body_size 10M;
        ssl_certificate /etc/letsencrypt/live/normal.btv.local/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/normal.btv.local/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        location / { set $upstream "http://existing-container:8000"; proxy_pass $upstream; }
    }

    server {
        listen 443 ssl;
        server_name old-tls.btv.local;
        client_max_body_size 10M;
        ssl_certificate /etc/letsencrypt/live/old-tls.btv.local/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/old-tls.btv.local/privkey.pem;
        ssl_protocols TLSv1 TLSv1.1;
        location / { proxy_pass http://old-tls-backend:8000; }
    }

    server {
        listen 443 ssl;
        server_name weak-cipher.btv.local;
        client_max_body_size 10M;
        ssl_certificate /etc/letsencrypt/live/weak-cipher.btv.local/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weak-cipher.btv.local/privkey.pem;
        ssl_ciphers RC4:DES;
        location / { proxy_pass http://weak-cipher-backend:8000; }
    }

    server {
        listen 80;
        server_name autoindex.btv.local;
        client_max_body_size 10M;
        location /files {
            autoindex on;
            root /var/www/public;
        }
        location / { proxy_pass http://autoindex-frontend:3000; }
    }

    server {
        listen 80;
        server_name missing-upstream.btv.local;
        location / { proxy_pass http://ghost-container:9000; }
    }

    server { listen 80 default_server; server_name _; return 444; }
}
