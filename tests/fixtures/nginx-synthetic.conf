worker_processes 2;
events { worker_connections 2048; use epoll; multi_accept on; }
http {
    include /etc/nginx/mime.types;
    include /etc/nginx/conf.d/*.conf;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
    gzip on; gzip_types text/plain text/css application/json;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 443 ssl http2;
        server_name http2-test.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/http2-test.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/http2-test.buildtovalue.cloud/privkey.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options DENY;
        location / { set $upstream "http://http2-backend:80"; proxy_pass $upstream; }
    }

    server {
        listen 80;
        server_name no-ssl-test.buildtovalue.cloud;
        location / { proxy_pass http://no-ssl-backend:80; }
    }

    server {
        listen 443 ssl;
        server_name cockpit-test.buildtovalue.cloud;
        ssl_certificate /etc/letsencrypt/live/cockpit-test.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cockpit-test.buildtovalue.cloud/privkey.pem;
        auth_basic "Cockpit";
        auth_basic_user_file /etc/nginx/.htpasswd;
        location / {
            proxy_set_header Remote-User "";
            proxy_set_header Remote-User $remote_user;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            set $upstream "http://docker-cockpit:8000";
            proxy_pass $upstream;
        }
    }

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}
